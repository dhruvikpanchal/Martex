<style>
  .brand-marquee {
    width: 100%;
    overflow: hidden;
    mask-image: linear-gradient(
      to right,
      transparent 0%,
      black 8%,
      black 92%,
      transparent 100%
    );
    -webkit-mask-image: linear-gradient(
      to right,
      transparent 0%,
      black 8%,
      black 92%,
      transparent 100%
    );
  }

  .brand-track {
    display: flex;
    width: max-content;
    gap: 80px;
  }

  .brand-item {
    width: 240px;
    min-width: 240px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .brand-item img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  @media (max-width: 768px) {
    .brand-track {
      gap: 40px;
    }
    .brand-item {
      width: 180px;
      min-width: 180px;
      height: 90px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand-track {
      animation: none;
    }
  }
</style>

<script>
  (() => {
    const track = document.getElementById("brandTrack");
    if (!track) return;

    const totalOriginalLogos = 9;
    const pauseTime = 1200;
    const moveTime = 700;
    let currentIndex = 0;

    function getStep() {
      const item = track.querySelector(".brand-item");
      if (!item) return 0;
      const itemWidth = item.getBoundingClientRect().width;
      const gap =
        Number.parseFloat(window.getComputedStyle(track).columnGap) || 0;
      return itemWidth + gap;
    }

    function moveNext() {
      currentIndex++;
      const step = getStep();
      track.style.transition = `transform ${moveTime}ms cubic-bezier(0.4, 0, 0.2, 1)`;
      track.style.transform = `translateX(-${currentIndex * step}px)`;

      if (currentIndex === totalOriginalLogos) {
        window.setTimeout(function () {
          track.style.transition = "none";
          currentIndex = 0;
          track.style.transform = "translateX(0)";
          track.offsetHeight;
          track.style.transition = `transform ${moveTime}ms cubic-bezier(0.4, 0, 0.2, 1)`;
        }, moveTime);
      }
    }

    function startMarquee() {
      window.setTimeout(function () {
        moveNext();
        startMarquee();
      }, pauseTime);
    }

    startMarquee();
    window.addEventListener("resize", function () {
      track.style.transition = "none";
      track.style.transform = `translateX(-${currentIndex * getStep()}px)`;
    });
  })();
</script>
