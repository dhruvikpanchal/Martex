<script>
  (function () {
    const section = document.getElementById("statistic-1");
    if (!section || section.dataset.counterInitialized) return;
    section.dataset.counterInitialized = "true";

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function animate(el, duration) {
      if (el.dataset.animated === "true") return;
      el.dataset.animated = "true";

      const target = parseFloat(el.getAttribute("data-target"));
      if (isNaN(target)) return;

      const suffix = el.getAttribute("data-suffix") || "";
      const prefix = el.getAttribute("data-prefix") || "";
      const decimals = parseInt(el.getAttribute("data-decimals") || "0", 10);
      const startValue = 0;
      const startTime = performance.now();

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeOutCubic(progress);
        const current = startValue + (target - startValue) * eased;

        if (decimals > 0) {
          el.textContent = prefix + current.toFixed(decimals) + suffix;
        } else {
          el.textContent = prefix + Math.round(current) + suffix;
        }

        if (progress < 1) {
          requestAnimationFrame(update);
        } else {
          el.textContent = prefix + (decimals > 0 ? target.toFixed(decimals) : target) + suffix;
        }
      }

      requestAnimationFrame(update);
    }

    function startAnimation() {
      const numbers = section.querySelectorAll(".statistic-number");
      numbers.forEach((num) => animate(num, 2000));
    }

    if ("IntersectionObserver" in window) {
      const observer = new IntersectionObserver(
        (entries, obs) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              obs.unobserve(entry.target);
              startAnimation();
            }
          });
        },
        {
          threshold: 0.15,
          rootMargin: "0px 0px -30px 0px",
        }
      );
      observer.observe(section);
    } else {
      startAnimation();
    }
  })();
</script>
