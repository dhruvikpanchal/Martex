<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Martex - Home</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        margin: 0;
      }
    </style>
  </head>

  <body class="bg-white dark:bg-gray-900">
    <!-- =====================================================
         HOME / DASHBOARD SECTION
    ====================================================== -->

    <section
      id="lnk-3"
      class="relative bg-[#f0effc] bg-[url(../assets/images/bg-04.jpg)] dark:bg-gray-800 dark:bg-none bg-cover bg-center bg-no-repeat scroll-animate"
    >
      <!-- Section Content -->
      <div
        class="relative w-full px-5 pt-20 pb-0 sm:px-8 sm:pt-24 md:px-10 md:pt-28 lg:px-12 lg:pt-32"
      >
        <div class="mx-auto w-full max-w-7xl">
          <!-- =================================================
               SECTION TITLE
          ================================================== -->

          <div class="mx-auto w-full max-w-4xl text-center">
            <h2
              class="mb-4 text-2xl sm:text-3xl md:text-4xl lg:text-[44px] font-bold leading-[1.2] tracking-tight text-[#2d3952] dark:text-white"
            >
              Track the progress towards objectives with key results
            </h2>

            <p class="text-base sm:text-lg md:text-xl leading-relaxed text-[#68758b] dark:text-gray-300">
              Ligula risus auctor tempus magna feugiat lacinia.
            </p>
          </div>

          <!-- =================================================
               DASHBOARD IMAGE
          ================================================== -->

          <div
            class="relative z-20 mx-auto mt-12 w-full translate-y-[8%] mb-[-8%] sm:mt-14 md:mt-16 lg:mt-20"
          >
            <!-- Dashboard -->
            <div class="relative w-full">
              <img
                src="assets/images/dashboard-01.png"
                alt="Martex Dashboard"
                class="block w-full h-auto rounded-2xl shadow-[0_20px_50px_rgba(31,41,55,0.18)]"
              />

              <!-- =================================================
                   PLAY BUTTON
              ================================================== -->

              <a
                href="https://www.youtube.com/watch?v=7e90gBu4pas"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Play video"
                class="video-play-btn group absolute left-1/2 top-1/2 z-30 -translate-x-1/2 -translate-y-1/2 cursor-pointer"
              >
                <!-- Outer Ring -->
                <span
                  class="video-play-ring absolute -inset-3 rounded-full transition-all duration-300 group-hover:-inset-4"
                  style="background-color: color-mix(in srgb, var(--color-brand-pink, #f6467f) 25%, transparent);"
                ></span>

                <!-- Button Circle -->
                <span
                  class="video-play-inner relative flex h-16 w-16 items-center justify-center rounded-full transition-transform duration-300 group-hover:scale-105 sm:h-20 sm:w-20 md:h-24 md:w-24 lg:h-28 lg:w-28"
                  style="background-color: var(--color-brand-pink, #f6467f); box-shadow: 0 12px 30px color-mix(in srgb, var(--color-brand-pink, #f6467f) 35%, transparent);"
                >
                  <!-- Play Icon -->
                  <svg
                    class="ml-1 h-7 w-7 fill-white sm:h-9 sm:w-9 md:h-11 md:w-11"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path d="M8 5v14l11-7z"></path>
                  </svg>
                </span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- =====================================================
         NEXT WHITE SECTION
    ====================================================== -->

    <section
      class="relative z-10 bg-white dark:bg-gray-900 px-5 pt-32 pb-20 sm:px-8 sm:pt-36 md:px-10 md:pt-40 lg:px-12 lg:pt-44"
    >
      <div class="mx-auto max-w-7xl text-center">
        <h3 class="text-xl font-medium text-[#2d3952] dark:text-white sm:text-2xl">
          <!-- Martex is loved and trusted by thousands: -->
        </h3>
      </div>
    </section>
  </body>
</html>
