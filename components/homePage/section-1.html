<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/output.css" />
  </head>

  <body>
    <section
      id="hero-1"
      class="bg--scroll text-white hero-section relative md:max-lg:mt-20! z-3 w-full bg-no-repeat bg-position-[center_center] bg-cover bg-fixed bg-[url(../../../../assets/images/hero-1.jpg)] pt-32.5 pb-25 lg:max-xl:pt-30 lg:max-xl:pb-20! md:max-lg:py-17.5 bg-[#894ADF]"
    >
      <div class="container">
        <div class="flex flex-wrap -mx-3 items-center">
          <!-- HERO TEXT -->
          <div
            class="xl:w-6/12 lg:max-xl:w-6/12 md:max-lg:w-6/12 w-full flex-[0_0_auto] px-3 max-w-full"
          >
            <div
              class="hero-1-txt color--white wow fadeInRight sm:max-md:px-[3%] sm:max-md:py-0"
              style="visibility: visible; animation-name: fadeInRight"
            >
              <!-- Title -->
              <h2
                class="text-white font-Jakarta font-bold text-[2.25rem] sm:text-[3rem] lg:text-[3.35rem] xl:text-[3.625rem] leading-[1.12] tracking-tight mb-6"
              >
                Content is the key<br class="hidden sm:inline" />
                to building an<br class="hidden sm:inline" />
                audience
              </h2>
              <!-- Text -->
              <p
                class="text-white/85 text-lg sm:text-[1.125rem] leading-[1.65] max-w-[500px] mb-8 font-normal"
              >
                Mauris donec turpis suscipit sapien ociis sagittis sapien tempor
                a volute ligula and aliquet tortor
              </p>
              <!-- Button -->
              <div>
                <a
                  href="#banner-3"
                  class="btn-hero-free inline-block bg-brand-pink text-white font-semibold text-base sm:text-lg px-7 sm:px-8 py-3.5 rounded-lg border-2 border-transparent transition-all duration-300 shadow-md"
                  >Get started for free</a
                >
              </div>
              <!-- Guarantee Note -->
              <div
                class="flex items-center text-sm sm:text-base text-white/85 mt-4 sm:mt-5 font-normal"
              >
                <svg
                  class="w-4 h-4 mr-2 shrink-0 stroke-white stroke-[2.5]"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                <span>No credit card needed, free 14-day trial</span>
              </div>
            </div>
          </div>
          <!-- END HERO TEXT -->
          <!-- HERO IMAGE -->
          <div
            class="xl:w-6/12 lg:max-xl:w-6/12 md:max-lg:w-6/12 w-full flex-[0_0_auto] px-3 max-w-full"
          >
            <div
              class="hero-1-img wow fadeInLeft"
              style="visibility: visible; animation-name: fadeInLeft"
            >
              <img
                class="w-full"
                src="../../assets/images/hero-1-img.png"
                alt="hero-image"
              />
            </div>
          </div>
        </div>
        <!-- End row -->
      </div>
      <!-- End container -->
    </section>
  </body>
</html>
