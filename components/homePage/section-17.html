<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Section 18 — Client Ratings</title>

    <script>
      // Logo images can still swap for a dark parent theme elsewhere on the site
      // (toggled by adding/removing the "dark" class on <html>). This section's
      // own background always stays white.
      window.tailwind = { config: { darkMode: "class" } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      :root {
        --ink: #6b6f7b;
        --star: #ffb30c;
        --star-empty: #e3e5ea;
        --badge-bg: #ffffff;
        --badge-border: rgba(17, 17, 17, 0.05);
        --divider: rgba(17, 17, 17, 0.08);
      }

      body {
        font-family:
          "Plus Jakarta Sans",
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }

      .rating-section {
        background: #ffffff;
        padding: 88px 0 96px;
        position: relative;
        overflow: hidden;
      }

      /* subtle depth without being loud */
      .rating-section::before {
        content: "";
        position: absolute;
        top: -180px;
        left: 50%;
        transform: translateX(-50%);
        width: 720px;
        height: 360px;
        background: radial-gradient(
          closest-side,
          rgba(255, 179, 12, 0.06),
          transparent 70%
        );
        pointer-events: none;
      }

      .rating-title {
        color: var(--ink);
        font-weight: 500;
        font-size: 1.15rem;
        line-height: 1.4;
        letter-spacing: -0.01em;
      }

      .rbox {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 12px;
        transition: transform 0.35s ease;
      }

      .rbox:hover {
        transform: translateY(-4px);
      }

      /* vertical dividers between columns on desktop only */
      @media (min-width: 768px) {
        .rbox-grid > .rbox:not(:first-child) {
          border-left: 1px solid var(--divider);
        }
      }

      .rbox-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
        height: 34px;
      }

      .rbox-logo img {
        height: 32px;
        width: auto;
        max-width: 160px;
        object-fit: contain;
      }

      .star-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: var(--badge-bg);
        border: 1px solid var(--badge-border);
        border-radius: 9999px;
        padding: 8px 20px;
        box-shadow: 0 8px 20px -8px rgba(17, 17, 17, 0.18);
        font-weight: 600;
        font-size: 0.92rem;
        color: var(--ink);
        transition: box-shadow 0.3s ease;
      }

      .rbox:hover .star-badge {
        box-shadow: 0 10px 26px -8px rgba(17, 17, 17, 0.24);
      }

      .stars {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }

      .stars svg {
        width: 15px;
        height: 15px;
      }
    </style>
  </head>
  <body>
    <section id="rating-1" class="rating-section">
      <div class="max-w-5xl mx-auto px-6">
        <!-- RATING TITLE -->
        <div class="text-center mb-14 md:mb-16">
          <h5 class="rating-title">
            Our clients love us as much as we love them
          </h5>
        </div>

        <!-- RATING BOXES -->
        <div
          class="rbox-grid grid grid-cols-1 md:grid-cols-3 gap-y-12 md:gap-y-0 place-items-center"
        >
          <!-- BOX 1: Capterra -->
          <div class="rbox" data-rating="4.7">
            <div class="rbox-logo">
              <!-- Replace src with your own logo files -->
              <img
                class="light-theme-img dark:hidden"
                src="../../assets/icons/brand-21-white.png"
                alt="Capterra"
              />
              <img
                class="dark-theme-img hidden dark:block"
                src="../../assets/icons/brand-21.png"
                alt="Capterra"
              />
            </div>
            <div class="star-badge">
              <span class="stars" aria-hidden="true"></span>
              <span class="rating-value">4.7/5</span>
            </div>
          </div>

          <!-- BOX 2: Trustpilot -->
          <div class="rbox" data-rating="4.95">
            <div class="rbox-logo">
              <!-- Replace src with your own logo files -->
              <img
                class="light-theme-img dark:hidden"
                src="../../assets/icons/brand-22-white.png"
                alt="Trustpilot"
              />
              <img
                class="dark-theme-img hidden dark:block"
                src="../../assets/icons/brand-22.png"
                alt="Trustpilot"
              />
            </div>
            <div class="star-badge">
              <span class="stars" aria-hidden="true"></span>
              <span class="rating-value">4.95/5</span>
            </div>
          </div>

          <!-- BOX 3: G2 Crowd -->
          <div class="rbox" data-rating="4.24">
            <div class="rbox-logo">
              <!-- Replace src with your own logo files -->
              <img
                class="light-theme-img dark:hidden"
                src="../../assets/icons/brand-23-white.png"
                alt="G2 Crowd"
              />
              <img
                class="dark-theme-img hidden dark:block"
                src="../../assets/icons/brand-23.png"
                alt="G2 Crowd"
              />
            </div>
            <div class="star-badge">
              <span class="stars" aria-hidden="true"></span>
              <span class="rating-value">4.24/5</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script>
      (function () {
        // ---- Star rendering: builds full / half / empty stars from a numeric rating ----
        function starIcon(fill) {
          return `<svg viewBox="0 0 20 20"><path fill="${fill}" d="M10 1.5l2.59 5.25 5.79.84-4.19 4.08.99 5.77L10 14.77l-5.18 2.67.99-5.77L1.62 7.6l5.79-.84L10 1.5z"/></svg>`;
        }

        function starHalfIcon() {
          const id = "half-" + Math.random().toString(36).slice(2, 9);
          return `<svg viewBox="0 0 20 20">
      <defs>
        <linearGradient id="${id}" x1="0" x2="1" y1="0" y2="0">
          <stop offset="50%" stop-color="var(--star)"/>
          <stop offset="50%" stop-color="var(--star-empty)"/>
        </linearGradient>
      </defs>
      <path fill="url(#${id})" d="M10 1.5l2.59 5.25 5.79.84-4.19 4.08.99 5.77L10 14.77l-5.18 2.67.99-5.77L1.62 7.6l5.79-.84L10 1.5z"/>
    </svg>`;
        }

        function renderStars(rating) {
          const full = Math.floor(rating);
          const remainder = rating - full;
          const hasHalf = remainder >= 0.25 && remainder < 0.75;
          const roundsUp = remainder >= 0.75;
          const filled = roundsUp ? full + 1 : full;
          const empty = 5 - filled - (hasHalf ? 1 : 0);

          let html = "";
          for (let i = 0; i < filled; i++) html += starIcon("var(--star)");
          if (hasHalf) html += starHalfIcon();
          for (let i = 0; i < empty; i++) html += starIcon("var(--star-empty)");
          return html;
        }

        document.querySelectorAll(".rbox").forEach((box) => {
          const rating = parseFloat(box.dataset.rating);
          box.querySelector(".stars").innerHTML = renderStars(rating);
        });
      })();
    </script>
  </body>
</html>
