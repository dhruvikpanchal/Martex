<!-- Style & Color Switcher -->
<div
  id="martexStyleSwitcher"
  class="fixed inset-0 z-[99999] pointer-events-none font-sans select-none"
>
  <!-- Backdrop (mobile/click-outside) -->
  <div
    id="switcherBackdrop"
    class="fixed inset-0 bg-black/40 backdrop-blur-xs opacity-0 pointer-events-none transition-opacity duration-300 z-[99998]"
  ></div>

  <!-- Toggle Tab Button (Always visible on right edge) -->
  <button
    id="switcherToggleBtn"
    type="button"
    aria-label="Toggle style switcher"
    title="Customize Colors & Theme"
    class="pointer-events-auto fixed right-0 top-[35%] -translate-y-1/2 flex items-center justify-center w-11 h-11 text-white rounded-l-xl rounded-r-none border-y border-l border-r-0 border-white/10 cursor-pointer transition-all duration-300 group z-[99999] focus:outline-none overflow-hidden"
  >
    <svg
      width="100%"
      height="100%"
      viewBox="0 0 50 50"
      class="w-full h-full text-[#ef174d] transition-colors duration-300"
      xmlns="http://www.w3.org/2000/svg"
    >
      <!-- Only Left Corners Rounded (Top-Left & Bottom-Left radius: 10, Right side straight: 0) -->
      <path
        d="M 50 0 L 10 0 Q 0 0 0 10 L 0 40 Q 0 50 10 50 L 50 50 Z"
        fill="currentColor"
      />

      <g stroke="white" stroke-width="2" stroke-linecap="round">
        <line x1="9" y1="15" x2="41" y2="15" />
        <line x1="9" y1="25" x2="41" y2="25" />
        <line x1="9" y1="35" x2="41" y2="35" />
      </g>

      <g fill="currentColor" stroke="white" stroke-width="2">
        <circle cx="31" cy="15" r="3.5" />
        <circle cx="19" cy="25" r="3.5" />
        <circle cx="31" cy="35" r="3.5" />
      </g>
    </svg>
  </button>

  <!-- Sliding Drawer Panel -->
  <aside
    id="switcherPanel"
    class="pointer-events-auto fixed top-0 right-0 h-full w-[310px] max-w-[90vw] bg-[#1a1d26] text-slate-200 shadow-[-10px_0_30px_rgba(0,0,0,0.5)] border-l border-white/10 flex flex-col z-[99999] translate-x-full transition-transform duration-300 ease-out"
    aria-label="Style Switcher Panel"
  >
    <!-- Drawer Header -->
    <div
      class="flex items-center justify-between px-5 py-4 border-b border-white/10 bg-[#161820]"
    >
      <div class="flex items-center gap-2.5">
        <span
          id="switcherBrandDot"
          class="w-2.5 h-2.5 rounded-full bg-[#f6467f] animate-pulse"
        ></span>
        <h3 class="text-base font-bold text-white tracking-wide">
          Style Switcher
        </h3>
      </div>
      <button
        id="switcherCloseBtn"
        type="button"
        aria-label="Close style switcher"
        class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/10 transition-colors cursor-pointer"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Drawer Content (Scrollable) -->
    <div class="flex-1 overflow-y-auto px-5 py-5 space-y-6 text-sm">
      <!-- Mode Switcher -->
      <div>
        <label
          class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-3"
        >
          Display Mode
        </label>
        <div
          class="grid grid-cols-2 gap-2 p-1 bg-[#12141c] rounded-xl border border-white/5"
        >
          <button
            id="modeLightBtn"
            type="button"
            class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg text-xs font-semibold cursor-pointer transition-all duration-200 bg-white/10 text-white shadow-sm"
          >
            <svg
              class="w-4 h-4 text-amber-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
              />
            </svg>
            Light
          </button>
          <button
            id="modeDarkBtn"
            type="button"
            class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg text-xs font-semibold cursor-pointer transition-all duration-200 text-slate-400 hover:text-white"
          >
            <svg
              class="w-4 h-4 text-indigo-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
              />
            </svg>
            Dark
          </button>
        </div>
      </div>

      <!-- Color Schemes -->
      <div>
        <div class="flex items-center justify-between mb-3">
          <label
            class="text-xs font-bold uppercase tracking-wider text-slate-400"
          >
            Accent Color
          </label>
          <span id="activeColorName" class="text-xs font-medium text-[#f6467f]"
            >Pink</span
          >
        </div>
        <div class="grid grid-cols-4 gap-3">
          <!-- Pink (Default) -->
          <button
            type="button"
            data-color-name="Pink"
            data-color-primary="#f6467f"
            data-color-dark="#e8306c"
            title="Brand Pink (Default)"
            class="color-preset-btn group relative flex items-center justify-center aspect-square rounded-xl transition-all duration-200 ring-2 ring-white scale-105 cursor-pointer"
            style="background-color: #f6467f"
          >
            <svg
              class="check-icon w-4 h-4 text-white drop-shadow"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </button>

          <!-- Blue -->
          <button
            type="button"
            data-color-name="Blue"
            data-color-primary="#2563eb"
            data-color-dark="#1d4ed8"
            title="Ocean Blue"
            class="color-preset-btn group relative flex items-center justify-center aspect-square rounded-xl transition-all duration-200 ring-0 hover:scale-105 cursor-pointer"
            style="background-color: #2563eb"
          >
            <svg
              class="check-icon hidden w-4 h-4 text-white drop-shadow"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </button>

          <!-- Violet -->
          <button
            type="button"
            data-color-name="Violet"
            data-color-primary="#7c3aed"
            data-color-dark="#6d28d9"
            title="Electric Violet"
            class="color-preset-btn group relative flex items-center justify-center aspect-square rounded-xl transition-all duration-200 ring-0 hover:scale-105 cursor-pointer"
            style="background-color: #7c3aed"
          >
            <svg
              class="check-icon hidden w-4 h-4 text-white drop-shadow"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </button>

          <!-- Emerald -->
          <button
            type="button"
            data-color-name="Emerald"
            data-color-primary="#059669"
            data-color-dark="#047857"
            title="Emerald Green"
            class="color-preset-btn group relative flex items-center justify-center aspect-square rounded-xl transition-all duration-200 ring-0 hover:scale-105 cursor-pointer"
            style="background-color: #059669"
          >
            <svg
              class="check-icon hidden w-4 h-4 text-white drop-shadow"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </button>

          <!-- Orange -->
          <button
            type="button"
            data-color-name="Orange"
            data-color-primary="#ea580c"
            data-color-dark="#c2410c"
            title="Sunset Orange"
            class="color-preset-btn group relative flex items-center justify-center aspect-square rounded-xl transition-all duration-200 ring-0 hover:scale-105 cursor-pointer"
            style="background-color: #ea580c"
          >
            <svg
              class="check-icon hidden w-4 h-4 text-white drop-shadow"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </button>

          <!-- Cyan -->
          <button
            type="button"
            data-color-name="Cyan"
            data-color-primary="#0891b2"
            data-color-dark="#0e7490"
            title="Cyan Aqua"
            class="color-preset-btn group relative flex items-center justify-center aspect-square rounded-xl transition-all duration-200 ring-0 hover:scale-105 cursor-pointer"
            style="background-color: #0891b2"
          >
            <svg
              class="check-icon hidden w-4 h-4 text-white drop-shadow"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </button>

          <!-- Rose -->
          <button
            type="button"
            data-color-name="Rose"
            data-color-primary="#e11d48"
            data-color-dark="#be123c"
            title="Rose Red"
            class="color-preset-btn group relative flex items-center justify-center aspect-square rounded-xl transition-all duration-200 ring-0 hover:scale-105 cursor-pointer"
            style="background-color: #e11d48"
          >
            <svg
              class="check-icon hidden w-4 h-4 text-white drop-shadow"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </button>

          <!-- Indigo -->
          <button
            type="button"
            data-color-name="Indigo"
            data-color-primary="#4f46e5"
            data-color-dark="#4338ca"
            title="Deep Indigo"
            class="color-preset-btn group relative flex items-center justify-center aspect-square rounded-xl transition-all duration-200 ring-0 hover:scale-105 cursor-pointer"
            style="background-color: #4f46e5"
          >
            <svg
              class="check-icon hidden w-4 h-4 text-white drop-shadow"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Drawer Footer -->
    <div class="p-4 border-t border-white/10 bg-[#161820]">
      <button
        id="switcherResetBtn"
        type="button"
        class="w-full py-2.5 px-4 rounded-xl border border-white/15 hover:border-white/30 text-xs font-semibold text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 transition-all flex items-center justify-center gap-2 cursor-pointer"
      >
        <svg
          class="w-4 h-4 text-slate-400"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
          />
        </svg>
        Reset to Default
      </button>
    </div>
  </aside>
</div>
