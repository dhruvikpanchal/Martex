<div
  id="welcome-modal"
  class="welcome-modal"
  role="dialog"
  aria-modal="true"
  aria-label="Get started promotion"
  aria-hidden="true"
  inert
>
  <div class="welcome-modal__backdrop" data-modal-close></div>

  <section class="welcome-modal__panel" role="document">
    <button
      class="welcome-modal__close"
      type="button"
      aria-label="Close welcome offer"
      data-modal-close
    >
      <span aria-hidden="true">&times;</span>
    </button>

    <a
      href="#section-20"
      class="welcome-modal__link"
      aria-label="Get started for free"
    >
      <img
        class="welcome-modal__image"
        src="./assets/images/modal-2-img.jpg"
        alt="Discover the Martex platform"
      />
    </a>
  </section>
</div>
